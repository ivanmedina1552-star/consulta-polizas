<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta de registro</title><style>body{background:#f4f5f8;color:#202a35;font:16px system-ui,Arial,sans-serif;margin:0}.card{max-width:600px;margin:50px auto;background:white;border-radius:18px;padding:30px;box-shadow:0 8px 26px #0001}img{display:block;max-width:140px;max-height:140px;margin:0 auto 25px}h1{text-align:center;font-size:24px}dt{color:#667085;margin-top:15px;font-size:13px}dd{font-size:18px;font-weight:650;margin:2px 0 9px}small{color:#667085}#notice{background:#f2f5f8;border-radius:10px;padding:16px;margin-top:20px}@media(max-width:650px){.card{margin:12px;padding:22px}}</style></head><body><main class="card"><img src="logo.png" alt="Logotipo Quálitas"><h1>Consulta de registro de póliza</h1><p id="loading">Consultando información…</p><dl id="details" hidden></dl><p id="notice">La información aquí mostrada corresponde al registro administrativo. Para confirmar cobertura y autenticidad, consulte directamente a Quálitas por sus canales oficiales.</p><small>Los datos personales completos no se muestran en esta página.</small></main><script src="config.js"></script><script>
(async()=>{const loading=document.getElementById('loading'),details=document.getElementById('details');const id=new URLSearchParams(location.search).get('id');if(!id||!/^[a-f0-9]{64}$/.test(id)){loading.textContent='Enlace inválido';return}try{const r=await fetch(window.API_CONSULTA+'?id='+encodeURIComponent(id),{cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'No se pudo consultar');const x=j.registro;loading.hidden=true;details.hidden=false;const vals=[['Folio',x.folio],['Vehículo',x.vehiculo],['Tipo',x.tipo],['Modelo',x.modelo],['Inicio de vigencia indicado',x.fecha_inicio],['Fin de vigencia indicado',x.fecha_fin],['Estado del registro',x.estado_registro==='verificada'?'Verificado con referencia externa':x.estado_registro==='cancelada'?'Cancelado':'Registrado (no verificado)'],['Vigencia temporal de fechas',x.vigencia_fecha?'Dentro del periodo indicado':'Fuera del periodo indicado']];for(const [label,value] of vals){const dt=document.createElement('dt');dt.textContent=label;const dd=document.createElement('dd');dd.textContent=value||'—';details.append(dt,dd)}}catch(e){loading.textContent='No disponible: '+e.message}})();
</script></body></html>
